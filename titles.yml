# ===== 13 danh hiệu nhiệm vụ - sửa tự do rồi /titleadmin reload =====
# requirements:  danh sách nhiệm vụ, phải hoàn thành TẤT CẢ mới mở khóa (có thông báo cho người chơi khi mở khóa)
#   type: PLAYTIME_MINUTES | KILL_PLAYER | KILL_MOB | BREAK_BLOCK | FISH | BOSS_KILL | TRAVEL_BLOCKS
#         KILL_STREAK       -> chuỗi hạ gục liên tiếp, reset khi chết (filter PLAYER = chỉ tính người chơi, ANY = tính cả quái)
#         PERMISSION_NODE   -> có quyền/nhóm bất kỳ, vd group.vip3 (LuckPerms)
#         ELEMENTER_UNLOCK  -> mở khóa nguyên tố ở plugin AstraxElementer  (filter: FIRE ICE LIGHTNING EARTH WIND LIGHT DARK DRAGON)
#         NGUYENTO_UNLOCK   -> mở khóa nguyên tố ở plugin NguyenTo         (filter: lua nuoc dat gio set bang bong_toi anh_sang)
#         PERMISSION        -> có quyền astraxtitles.title.<id>
#   filter: mục tiêu (ZOMBIE, DIAMOND_ORE, dragon_lord...) ; target: số lượng ; label: mô tả tùy chỉnh (không bắt buộc)
# buffs:     attribute -> giá trị. Số thường = cộng thẳng, có % = cộng theo %  (2 máu = 1 tim)
# passives:  nội tại chiến đấu. type + các tham số: value, value2 (%), chance (%), threshold (% máu), duration, cooldown (giây), filter
#   OUTGOING_DAMAGE_PERCENT  DAMAGE_VS_BURNING_PERCENT  BOSS_DAMAGE_PERCENT  IGNITE_ON_HIT  SLOW_ON_HIT  WEAKEN_ON_HIT
#   LIFESTEAL_PERCENT  LIFESTEAL_ON_HIT  LIGHTNING_ON_HIT  BONUS_DAMAGE_ON_HIT  DODGE  DAMAGE_REDUCTION_PERCENT
#   DAMAGE_REDUCTION_FROM_ELEMENT  HEAL_RECEIVED_PERCENT  LOW_HP_BOOST  LOW_HP_HEAL
